<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AQUASENSE - Live</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--bg:#070b14;--p:#101828;--c:#121d33;--b:#1e2f52;--a:#00e5b0;--bl:#3b82f6;--r:#ef4444;--g:#22c55e;--t:#e6edf7;--m:#8a9bb5}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--t);font-family:ui-monospace,monospace}
header{padding:12px 16px;background:var(--p);border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}.btn-bl{background:var(--bl);color:#fff}.btn-a{background:var(--a);color:#000}.btn-r{background:transparent;color:var(--r);border:1px solid var(--r)}
input{background:var(--bg);border:1px solid var(--b);color:#fff;padding:11px;border-radius:8px;width:100%;outline:none}
.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 30%,#0f1e38,#070b14)}
.cardBox{background:var(--c);border:2px solid var(--a);border-radius:18px;padding:26px;width:400px;max-width:95vw;text-align:center;box-shadow:0 0 40px rgba(0,229,176,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;padding:12px;max-width:1400px;margin:auto}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;max-width:1400px;margin:auto}
@media(max-width:800px){.top{grid-template-columns:1fr}}
.card{background:var(--c);border:1.5px solid var(--b);border-radius:14px;padding:14px;position:relative;transition:.3s}
.card.online{border-color:var(--g);box-shadow:0 0 15px rgba(34,197,94,.18)}
.card.offline{border-color:var(--r);opacity:.55}
.card.new{border-color:var(--a);box-shadow:0 0 25px rgba(0,229,176,.6);transform:scale(1.02)}
.badge{padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:800}
.open{background:rgba(0,229,176,.15);color:var(--a);border:1px solid var(--a)}
.closed{background:rgba(239,68,68,.15);color:var(--r);border:1px solid var(--r)}
.row{display:flex;justify-content:space-between;font-size:.75rem;margin:5px 0}
.sGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.s{background:var(--bg);border:1px solid var(--b);border-radius:9px;padding:9px;text-align:center}.s b{display:block;font-size:1.15rem}
#dash{display:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.tag{position:absolute;top:-8px;right:10px;background:var(--a);color:#000;font-size:.6rem;font-weight:900;padding:2px 8px;border-radius:20px;display:none}
.card.new .tag{display:block}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--m);border:1px dashed var(--b);border-radius:14px}
</style>
</head>
<body>

<div id="home" class="home">
  <div class="cardBox">
    <h2 style="color:var(--a);letter-spacing:2px">AQUASENSE</h2>
    <div style="font-size:.65rem;color:var(--m);margin:10px 0">Auto Live - Master: <b>aquasense/moses_kaaga_9x7p2</b><br>admin/1234 = ALL | ID/PIN = OWN</div>
    <input id="uid" placeholder="ID - admin or 1">
    <input id="pwd" type="password" placeholder="PIN - 1234" style="margin-top:8px">
    <button class="btn btn-a" style="width:100%;margin-top:12px" onclick="login()">LOGIN & AUTO-CONNECT</button>
    <input id="topic" value="aquasense/moses_kaaga_9x7p2" style="margin-top:10px;font-size:.7rem">
    <input id="ip" placeholder="Master IP optional (http://192.168.x.x)" style="margin-top:6px;font-size:.7rem">
    <div id="msg" style="color:var(--r);font-size:.7rem;margin-top:8px"></div>
    <div id="connStatus" style="font-size:.65rem;color:var(--m);margin-top:8px">MQTT: Disconnected</div>
  </div>
</div>

<div id="dash">
<header>
  <div><b id="title" style="color:var(--a)">DASHBOARD</b> <span id="live" style="font-size:.7rem;color:var(--m);margin-left:10px"></span></div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="mqttDot" style="font-size:.7rem"><span class="dot" style="background:var(--r)"></span> <span id="mqttTxt">OFFLINE</span></span>
    <button class="btn btn-r" onclick="logout()">LOGOUT</button>
  </div>
</header>
<div id="top" class="top"></div>
<div id="grid" class="grid"></div>
</div>

<script>
const $=s=>document.getElementById(s);
let S={nodes:[],base:'',cli:null,role:null,cur:null,last:0,statusTimer:null,ip:''};
let REG=JSON.parse(localStorage.getItem('REG')||'[]');
if(REG.length==0){REG=[{id:'1',name:'Customer 1',pin:'1234'},{id:'2',name:'Customer 2',pin:'2345'},{id:'3',name:'Customer 3',pin:'3456'},{id:'4',name:'Customer 4',pin:'4567'}]; localStorage.setItem('REG',JSON.stringify(REG));}

function isOnline(n){ 
  // Use BOTH Master online flag AND local timeout (Master timeout is 60000ms)
  let age = Date.now() - n._ms;
  return n.online !== false && age < 70000; 
}

// AUTO-UPDATE when Master publishes
function mergePayload(d){
  if(!d||!d.nodes||!Array.isArray(d.nodes)) return;
  let hasChange=false;
  d.nodes.forEach(o=>{
    let id=String(o.id).trim(); if(id=='0') return;
    let ex=S.nodes.find(x=>x.id==id);
    let obj={
      id:id, flow:Number(o.flow||0), total:Number(o.total||0),
      m1:Number(o.m1??o.moist1??0), m2:Number(o.m2??o.moist2??0),
      t:Number(o.temp||0), h:Number(o.hum||0),
      valve:(o.valve||'UNKNOWN').toUpperCase(),
      rssi:Number(o.rssi||0), online:o.online!==false,
      _ms:Date.now(), isNew:!ex
    };
    if(ex){
      if(ex.flow!=obj.flow || ex.total!=obj.total || ex.valve!=obj.valve) obj.isNew=true;
      Object.assign(ex,obj);
    } else {
      S.nodes.push(obj);
      console.log('AUTO: New node came online ->',id);
    }
    hasChange=true;
    if(!REG.find(r=>r.id==id)){REG.push({id:id,name:'Customer '+id,pin:'1234'}); localStorage.setItem('REG',JSON.stringify(REG));}
  });
  S.last=Date.now();
  if(hasChange) render();
  setTimeout(()=>{S.nodes.forEach(n=>n.isNew=false); render();},3500);
}

function cardHTML(n){
  let r=REG.find(x=>x.id==n.id)||{name:'Customer '+n.id};
  let on=isOnline(n); let vClass=n.valve.includes('OPEN')?'open':'closed';
  return `<div class="card ${on?'online':'offline'} ${n.isNew?'new':''}" id="card-${n.id}">
    <div class="tag">${n.isNew?'● UPDATED / NEW ONLINE':''}</div>
    <div class="row"><b>C${n.id} - ${r.name}</b><span style="font-size:.6rem;color:${on?'var(--g)':'var(--r)'}"><span class="dot" style="background:${on?'var(--g)':'var(--r)'}"></span> ${on?'ONLINE':'OFFLINE'} • ${n.rssi}dBm • ${Math.round((Date.now()-n._ms)/1000)}s ago</span></div>
    <div style="text-align:center;margin:10px 0"><div style="font-size:2.2rem;font-weight:900;color:${on?'var(--a)':'var(--m)'}">${n.total.toFixed(1)}L</div><div style="font-size:.7rem">${n.flow.toFixed(2)} L/min • ${(n.total/1000).toFixed(3)} m³</div></div>
    <div class="sGrid"><div class="s"><span style="font-size:.55rem">MOIST 1</span><b>${n.m1.toFixed(0)}%</b></div><div class="s"><span style="font-size:.55rem">MOIST 2</span><b>${n.m2.toFixed(0)}%</b></div><div class="s"><span style="font-size:.55rem">TEMP</span><b>${n.t.toFixed(1)}°C</b></div><div class="s"><span style="font-size:.55rem">HUM</span><b>${n.h.toFixed(0)}%</b></div></div>
    <div class="row"><span>VALVE</span><b class="badge ${vClass}">${n.valve}</b></div><div class="row"><span>MASTER SAYS</span><b style="font-size:.65rem">${n.online?'ONLINE':'OFFLINE'}</b></div>
    <div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-a" style="flex:1" onclick="sendCmd('${n.id}','open')">OPEN</button><button class="btn btn-r" style="flex:1" onclick="sendCmd('${n.id}','close')">CLOSE</button></div>
  </div>`;
}

function render(){
  let all=[...S.nodes].sort((a,b)=>Number(a.id)-Number(b.id));
  let onlineNodes=all.filter(n=>isOnline(n));
  let tot=onlineNodes.reduce((a,b)=>a+b.total,0);
  let flow=onlineNodes.reduce((a,b)=>a+b.flow,0);
  $('live').textContent=`${onlineNodes.length}/${all.length} ONLINE | ${tot.toFixed(1)}L | Last: ${S.last?new Date(S.last).toLocaleTimeString():''}`;
  if(S.role==='admin'){
    $('title').textContent=`ADMIN AUTO-LIVE (${onlineNodes.length}/${all.length})`;
    $('top').innerHTML=`<div class="card online"><div style="font-size:.6rem;color:var(--m)">ONLINE / TOTAL</div><div style="font-size:2rem;font-weight:900;color:var(--g)">${onlineNodes.length} / ${all.length}</div></div><div class="card"><div style="font-size:.6rem;color:var(--m)">WATER USED</div><div style="font-size:2rem;font-weight:900;color:var(--a)">${tot.toFixed(1)}L</div></div><div class="card"><div style="font-size:.6rem;color:var(--m)">FLOW</div><div style="font-size:2rem;font-weight:900">${flow.toFixed(2)} L/min</div></div>`;
    $('grid').innerHTML=all.length?all.map(n=>cardHTML(n)).join(''):`<div class="empty">⏳ Waiting for Master to publish<br>Master Serial must show <b>MQTT PUB</b> every 2s<br>Topic: <b>${S.base}/live</b></div>`;
  } else {
    let n=S.nodes.find(x=>x.id==S.cur);
    if(!n){ $('grid').innerHTML=`<div class="empty">Node C${S.cur} OFFLINE<br>Will auto-appear when LoRa packet for ID ${S.cur} arrives</div>`; return; }
    $('top').innerHTML=''; $('grid').innerHTML=cardHTML(n);
  }
}

function sendCmd(id,action){
  let payload=JSON.stringify({node:String(id),action:action});
  if(S.cli&&S.cli.connected){ S.cli.publish(S.base+'/cmd',payload); console.log('CMD MQTT:',payload); }
  if(S.ip && location.protocol!=='https:'){
    let url=S.ip.startsWith('http')?S.ip:`http://${S.ip}`;
    fetch(`${url}/valve?node=${id}&action=${action}`).catch(()=>{});
  }
  let n=S.nodes.find(x=>x.id==id); if(n){ n.valve=action.toUpperCase(); n.isNew=true; render(); setTimeout(()=>{n.isNew=false; render();},2000); }
}

function connectMQTT(){
  S.base=$('topic').value.trim()||'aquasense/moses_kaaga_9x7p2';
  S.ip=$('ip').value.trim().replace(/\/$/,'');
  localStorage.setItem('AQUA_BASE',S.base); localStorage.setItem('AQUA_IP',S.ip);
  try{if(S.cli) S.cli.end();}catch(e){}
  $('connStatus').textContent='MQTT: Connecting wss://broker.hivemq.com:8884/mqtt'; $('mqttTxt').textContent='CONNECTING';
  S.cli=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'aqua_'+Math.random().toString(16).slice(2,10),keepalive:30,clean:true,reconnectPeriod:2000});
  S.cli.on('connect',()=>{
    $('connStatus').textContent='MQTT: Connected - AUTO LIVE ON'; $('connStatus').style.color='var(--g)';
    $('mqttTxt').textContent='ONLINE AUTO'; document.querySelector('#mqttDot .dot').style.background='var(--g)';
    S.cli.subscribe(S.base+'/live', err=>{ console.log(err?'SUB FAIL':'SUB OK '+S.base+'/live'); });
    if(S.statusTimer) clearInterval(S.statusTimer);
    S.statusTimer=setInterval(render,2000); // auto move to offline
  });
  S.cli.on('message',(t,m)=>{ if(t===S.base+'/live'){ try{ mergePayload(JSON.parse(m.toString())); }catch(e){} } });
  S.cli.on('close',()=>{ $('mqttTxt').textContent='RECONNECTING...'; document.querySelector('#mqttDot .dot').style.background='var(--r)'; });
}

function login(){
  let u=$('uid').value.trim().toLowerCase(), p=$('pwd').value.trim(); S.base=$('topic').value.trim();
  if(u==='admin'&&p==='1234'){ S.role='admin'; $('home').style.display='none'; $('dash').style.display='block'; connectMQTT(); return; }
  let f=REG.find(x=>x.id==u&&x.pin==p); if(f){ S.role='customer'; S.cur=u; $('home').style.display='none'; $('dash').style.display='block'; connectMQTT(); return; }
  $('msg').textContent='Wrong - use admin/1234';
}
function logout(){ $('dash').style.display='none'; $('home').style.display='flex'; S.role=null; S.nodes=[]; if(S.statusTimer) clearInterval(S.statusTimer); if(S.cli) try{S.cli.end()}catch(e){} }
(function(){ $('topic').value=localStorage.getItem('AQUA_BASE')||'aquasense/moses_kaaga_9x7p2'; $('ip').value=localStorage.getItem('AQUA_IP')||''; })();
</script>
</body>
</html>
