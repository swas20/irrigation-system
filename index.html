<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AQUASENSE IRRIGATION - 2 MOIST + DHT22 + FLOW + VALVE</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{--bg:#070b14;--p:#101828;--c:#121d33;--b:#1e2f52;--a:#00e5b0;--bl:#3b82f6;--r:#ef4444;--y:#f59e0b;--g:#22c55e;--t:#e6edf7;--m:#8a9bb5}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--t);font-family:monospace}
header{padding:12px 16px;background:var(--p);border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{color:var(--a);font-weight:900;letter-spacing:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.online{background:var(--g);box-shadow:0 0 8px var(--g)}.offline{background:#555}
.badge{padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:800}.open{background:rgba(0,229,176,.15);color:var(--a);border:1px solid var(--a)}.closed{background:rgba(239,68,68,.15);color:var(--r);border:1px solid var(--r)}.onl{background:rgba(34,197,94,.2);color:var(--g);border:1px solid var(--g)}.offl{background:rgba(100,100,100,.2);color:#aaa;border:1px solid #666}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;font-family:monospace}.btn-bl{background:var(--bl);color:#fff}.btn-a{background:var(--a);color:#000}.btn-r{background:transparent;color:var(--r);border:1px solid var(--r)}.btn-y{background:var(--y);color:#000}
input{background:var(--bg);border:1px solid var(--b);color:#fff;padding:10px;border-radius:8px;width:100%}
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 30%,#0f1e38,#070b14)}
.cardBox{background:var(--c);border:2px solid var(--a);border-radius:16px;padding:26px;width:420px;max-width:95vw;text-align:center;box-shadow:0 0 40px rgba(0,229,176,.25)}
.top{display:grid;grid-template-columns:400px 1fr;gap:12px;padding:12px;max-width:1400px;margin:auto}@media(max-width:1000px){.top{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;padding:12px;max-width:1400px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px}.mon{border:2px solid var(--bl)}.zone{border:1.5px solid var(--b)}.zone.active{border-color:var(--a);box-shadow:0 0 20px rgba(0,229,176,.2)}
.row{display:flex;justify-content:space-between;font-size:.75rem;margin:5px 0}.flow{font-size:2.4rem;font-weight:900;text-align:center;margin:8px 0;color:var(--a)}
.sensorGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sensor{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:10px;text-align:center}.sensor b{font-size:1.3rem;display:block}
.sum{background:linear-gradient(180deg,var(--c),var(--p));border:1px solid var(--b);border-radius:12px;padding:12px}.sum-l{font-size:.55rem;color:var(--m)}.sum-v{font-size:1.3rem;font-weight:800;margin-top:4px}
#dash{display:none}
</style>
</head>
<body>

<div id=home class=home>
  <div style="background:var(--p);border:2px solid var(--a);border-radius:16px;padding:18px 28px;margin-bottom:20px;text-align:center;max-width:900px;width:100%"><h1 style="color:var(--a);letter-spacing:2px">AQUASENSE SMART IRRIGATION</h1><div style="font-size:.65rem;color:var(--m);margin-top:6px">2x Soil Moisture + DHT22 + Flow Rate + Valve | ONE LOGIN | REAL MASTER LORA</div></div>
  <div class=cardBox>
    <h3 style="color:var(--a)">🔐 SINGLE LOGIN</h3>
    <p style="font-size:.6rem;color:var(--m);margin:8px 0">Admin: <b>admin / 1234</b> → ALL<br>Farmer: <b>ID / PIN</b> e.g. 1/1234 → OWN ZONE</p>
    <input id=uid placeholder="Username or ID - admin or 1" style="margin-bottom:10px">
    <div style="display:flex;gap:6px;margin-bottom:10px"><input id=pwd type=password placeholder="Password / PIN - 1234" style="flex:1"><button onclick="let e=$('pwd');e.type=e.type=='password'?'text':'password'" style="background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px">👁</button></div>
    <button class="btn btn-a" style="width:100%" onclick="doSingleLogin()">LOGIN TO IRRIGATION</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><input id=cfgIp placeholder="Master IP 192.168.1.100" style="font-size:.7rem"><input id=cfgTopic value="aquasense/moses_kaaga_9x7p2" style="font-size:.7rem"></div>
    <button class="btn btn-y" style="width:100%;margin-top:10px" onclick="showReg()">REGISTER ZONE</button>
    <div id=msg style="color:var(--r);font-size:.7rem;margin-top:10px;min-height:18px"></div>
  </div>
</div>

<div id=dash>
<header><div style="display:flex;gap:12px;align-items:center"><div class=logo id=dashTitle>IRRIGATION DASHBOARD</div><span id=live style="font-size:.7rem;color:var(--y)"></span></div><div style="display:flex;gap:6px"><button class="btn btn-bl" style="padding:6px 10px" onclick="connectAll()">CONNECT MASTER</button><button class="btn btn-r" style="padding:6px 10px" onclick="logout()">LOGOUT</button></div></header>
<div id=top class=top></div>
<div id=grid class=grid></div>
</div>

<script>
let $=s=>document.getElementById(s);
let S={nodes:[],summary:{mon:0,cust:0,diff:0,perc:0},base:'aquasense/moses_kaaga_9x7p2',cli:null,role:null,cur:null,ip:'',lastSync:0,timer:null};
let REG=JSON.parse(localStorage.getItem('AQUA_IRRI_FINAL')||'[]');
if(REG.length==0){ REG=[{id:'1',name:'Zone 1 - Farm A',pin:'1234',registered:true},{id:'2',name:'Zone 2 - Farm B',pin:'2345',registered:true},{id:'3',name:'Zone 3 - Farm C',pin:'3456',registered:true}]; localStorage.setItem('AQUA_IRRI_FINAL',JSON.stringify(REG)); }
function saveReg(){localStorage.setItem('AQUA_IRRI_FINAL',JSON.stringify(REG));}
function isOnline(id){let n=S.nodes.find(x=>x.id==String(id)); return n && (Date.now()-n.lastSeen<65000); }
function getNode(id){return S.nodes.find(x=>x.id==String(id));}

function mergeMaster(data){
  if(!data||!data.nodes) return;
  if(data.summary) S.summary=data.summary;
  data.nodes.forEach(o=>{
    let id=String(o.id);
    let idx=S.nodes.findIndex(x=>x.id==id);
    // SUPPORT 2 MOISTURE + DHT22 + FLOW + VALVE
    let obj={
      id:id,
      flow:Number(o.flow||o.flowRate||0),
      total:Number(o.total||0),
      moist1:Number(o.moist1||o.moisture1||o.m1||0),
      moist2:Number(o.moist2||o.moisture2||o.m2||0),
      temp:Number(o.temp||o.temperature||0),
      hum:Number(o.hum||o.humidity||0),
      valve:o.valve||"UNKNOWN",
      rssi:Number(o.rssi||0),
      paid:Number(o.paid||0),
      remaining:Number(o.remaining||0),
      lastSeen:Date.now()
    };
    if(idx>=0) S.nodes[idx]={...S.nodes[idx],...obj}; else S.nodes.push(obj);
  });
  S.lastSync=Date.now();
}

function render(){
  let mon=getNode('0'); let zones=S.nodes.filter(n=>n.id!='0');
  let monT=S.summary.mon||(mon?mon.total:0); let custT=S.summary.cust||zones.reduce((a,b)=>a+b.total,0);
  let online=S.nodes.filter(n=>isOnline(n.id)).length;
  $('live').innerHTML=`<span class="dot ${isOnline('0')?'online':'offline'}"></span> ${online}/${S.nodes.length} ONLINE | SYNC ${S.lastSync?new Date(S.lastSync).toLocaleTimeString():'WAIT MASTER'}`;

  if(S.role=='admin'){
    $('dashTitle').textContent='ADMIN - ALL ZONES - 2xMOIST + DHT22 + FLOW + VALVE - REAL';
    let mFlow=mon?mon.flow.toFixed(2):'0.00';
    $('top').innerHTML=`
    <div class="card mon"><div class=row><span>MASTER MONITOR ID 0 - REAL</span><span class="badge ${isOnline('0')?'onl':'offl'}">${isOnline('0')?'ONLINE':'OFFLINE'}</span></div>
      <div class=flow style="color:var(--bl)">${mFlow} L/min</div>
      <div class=sensorGrid>
        <div class=sensor><span style="font-size:.6rem;color:var(--m)">MOISTURE 1</span><b style="color:var(--a)">${mon?mon.moist1:0}%</b></div>
        <div class=sensor><span style="font-size:.6rem;color:var(--m)">MOISTURE 2</span><b style="color:var(--a)">${mon?mon.moist2:0}%</b></div>
        <div class=sensor><span style="font-size:.6rem;color:var(--m)">DHT22 TEMP</span><b style="color:var(--y)">${mon?mon.temp:0}°C</b></div>
        <div class=sensor><span style="font-size:.6rem;color:var(--m)">DHT22 HUM</span><b style="color:var(--bl)">${mon?mon.hum:0}%</b></div>
      </div>
      <div class=row><span>Flow Rate:</span><b>${mon?mon.flow:0} L/min</b></div>
      <div class=row><span>Valve:</span><b class="badge ${mon&&mon.valve.includes('OPEN')?'open':'closed'}">${mon?mon.valve:'UNKNOWN'}</b></div>
      <div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-a" style="flex:1" onclick="cmd('0','open')">OPEN MAIN</button><button class="btn btn-r" style="flex:1" onclick="cmd('0','close')">CLOSE MAIN</button></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class=sum><div class=sum-l>MASTER TOTAL</div><div class=sum-v style="color:var(--bl)">${monT} L</div></div><div class=sum><div class=sum-l>ALL ZONES FLOW</div><div class=sum-v style="color:var(--a)">${zones.reduce((a,b)=>a+b.flow,0).toFixed(2)} L/min</div></div><div class=sum><div class=sum-l>AVG MOISTURE</div><div class=sum-v style="color:var(--a)">${zones.length?((zones.reduce((a,b)=>a+b.moist1+b.moist2,0)/(zones.length*2)).toFixed(0))+'%':'--'}</div><div style="font-size:.6rem;color:var(--m)">2 sensors per zone</div></div><div class=sum><div class=sum-l>DHT22 AVG</div><div class=sum-v style="color:var(--y)">${zones.length?(zones.reduce((a,b)=>a+b.temp,0)/zones.length).toFixed(1)+'°C / '+(zones.reduce((a,b)=>a+b.hum,0)/zones.length).toFixed(0)+'%':''}</div></div></div>`;

    let allIds=[...new Set([...REG.map(r=>r.id),...S.nodes.map(n=>n.id)])].filter(id=>id!='0').sort((a,b)=>Number(a)-Number(b));
    $('grid').innerHTML=allIds.map(id=>{
      let reg=REG.find(r=>r.id==id)||{name:'Zone '+id}; let n=getNode(id);
      if(!n) return `<div class=card style="border:1px dashed var(--y)"><b>Zone ${id} - ${reg.name}</b><div style="text-align:center;color:var(--y);padding:20px">⏳ Waiting LoRa for ID ${id}<br><span style="font-size:.6rem">Packet: "${id}:moist1,moist2,temp,hum,flow/total" e.g. "${id}:30,35,28.5,65,2.3/120"</span></div></div>`;
      return zoneCard(n,reg,false);
    }).join('');
  }
  else if(S.role=='customer'){
    let reg=REG.find(r=>r.id==S.cur); let n=getNode(S.cur);
    $('dashTitle').textContent=`FARMER ZONE ${S.cur} - OWN ONLY - 2 MOIST + DHT22 + FLOW + VALVE`;
    if(!n){
      $('top').innerHTML=`<div class="card" style="border:2px solid var(--a);grid-column:1/-1;text-align:center;padding:30px"><div style="color:var(--y)">⏳ Waiting Real LoRa for YOUR Zone ${S.cur}</div></div>`;
      $('grid').innerHTML=zoneCard({id:S.cur,flow:0,total:0,moist1:0,moist2:0,temp:0,hum:0,valve:'UNKNOWN',rssi:0,paid:0,remaining:0,lastSeen:0}, reg, true);
      return;
    }
    $('top').innerHTML=`
    <div class="card" style="border:2px solid var(--a);box-shadow:0 0 20px rgba(0,229,176,.3)">
      <div class=row><span>MY ZONE ${n.id} - ${reg.name} - REAL LIKE MONITOR</span><span class="dot ${isOnline(n.id)?'online':'offline'}"></span></div>
      <div class=flow>${n.flow.toFixed(2)} L/min</div>
      <div class=sensorGrid>
        <div class=sensor style="border-color:var(--a)"><span style="font-size:.6rem">MOIST 1</span><b style="color:var(--a)">${n.moist1}%</b><span style="font-size:.6rem;color:${n.moist1<30?'var(--r)':'var(--g)'}">${n.moist1<30?'DRY - IRRIGATE':n.moist1>70?'WET':'OK'}</span></div>
        <div class=sensor style="border-color:var(--a)"><span style="font-size:.6rem">MOIST 2</span><b style="color:var(--a)">${n.moist2}%</b><span style="font-size:.6rem;color:${n.moist2<30?'var(--r)':'var(--g)'}">${n.moist2<30?'DRY':n.moist2>70?'WET':'OK'}</span></div>
        <div class=sensor><span style="font-size:.6rem">DHT22 TEMP</span><b style="color:var(--y)">${n.temp}°C</b></div>
        <div class=sensor><span style="font-size:.6rem">DHT22 HUM</span><b style="color:var(--bl)">${n.hum}%</b></div>
      </div>
      <div class=row><span>Flow Rate Real:</span><b>${n.flow} L/min</b></div>
      <div class=row><span>Valve Real:</span><b class="badge ${n.valve.includes('OPEN')?'open':'closed'}">${n.valve}</b></div>
      <div style="display:flex;gap:6px;margin-top:12px"><button class="btn btn-a" style="flex:1" onclick="cmd('${n.id}','open')">OPEN VALVE</button><button class="btn btn-r" style="flex:1" onclick="cmd('${n.id}','close')">CLOSE VALVE</button><button class="btn btn-y" style="flex:1" onclick="cmd('${n.id}','auto')">AUTO MOIST</button></div>
    </div>
    <div class=sum><div class=sum-l>MY ZONE IRRIGATION STATUS</div><div class=sum-v style="color:${n.moist1<30||n.moist2<30?'var(--r)':'var(--a)'}">${n.moist1<30||n.moist2<30?'NEEDS WATER':'OK'}</div><div style="font-size:.7rem;margin-top:6px">Avg Moist: ${((n.moist1+n.moist2)/2).toFixed(0)}% | Temp: ${n.temp}°C<br>Remaining: ${(n.remaining/0.1).toFixed(0)}L</div></div>`;
    $('grid').innerHTML=zoneCard(n,reg,true);
  }
}

function zoneCard(n,reg,isOwner){
  let online=isOnline(n.id);
  let avgMoist=((n.moist1+n.moist2)/2).toFixed(0);
  let pay = isOwner? `<div style="margin-top:10px;border-top:2px dashed var(--a);padding:12px;background:rgba(0,229,176,.07);border-radius:10px"><div style="font-size:.7rem;color:var(--a);font-weight:800">💰 M-PESA + TIMER - CUSTOMER ONLY</div><div style="display:flex;gap:6px;margin-top:8px"><input id=am${n.id} type=number placeholder="Ksh 100=1M³"><button class="btn btn-a" onclick="payZone('${n.id}')">PAY & OPEN</button></div><div id=mp${n.id} style="font-size:.7rem;text-align:center;margin-top:6px"></div><div style="display:flex;gap:6px;margin-top:8px"><input id=timer${n.id} type=number placeholder="Mins e.g. 30"><button class="btn btn-y" onclick="timerIrrigate('${n.id}')">TIMER IRRIGATE</button></div></div>`:'';
  return `<div class="card zone ${online?'active':''}">
    <div class=row><b>Zone ${n.id} - ${reg?reg.name:''} - REAL</b><span class="badge ${online?'onl':'offl'}">${online?'ONLINE':'OFFLINE'} ${n.rssi}dBm</span></div>
    <div class=sensorGrid>
      <div class=sensor><span style="font-size:.55rem">MOIST 1</span><b>${n.moist1}%</b></div>
      <div class=sensor><span style="font-size:.55rem">MOIST 2</span><b>${n.moist2}%</b></div>
      <div class=sensor><span style="font-size:.55rem">DHT22 T</span><b>${n.temp}°C</b></div>
      <div class=sensor><span style="font-size:.55rem">DHT22 H</span><b>${n.hum}%</b></div>
    </div>
    <div style="text-align:center;margin:6px 0"><span style="font-size:1.6rem;color:var(--a)">${n.flow.toFixed(2)} L/min</span> <span style="font-size:.7rem">FLOW</span> | Avg Moist <b style="color:${avgMoist<30?'var(--r)':'var(--a)'}">${avgMoist}%</b></div>
    <div class=row><span>Total:</span><b>${n.total} L</b></div><div class=row><span>Valve:</span><b class="badge ${n.valve.includes('OPEN')?'open':'closed'}">${n.valve}</b></div>
    <div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-a" style="flex:1" onclick="cmd('${n.id}','open')">OPEN VALVE</button><button class="btn btn-r" style="flex:1" onclick="cmd('${n.id}','close')">CLOSE</button><button class="btn btn-y" style="flex:1" onclick="cmd('${n.id}','auto')">AUTO</button></div>
    ${pay}
  </div>`;
}

function cmd(id,action){
  let p=JSON.stringify({node:String(id),action:action});
  if(S.cli&&S.cli.connected) S.cli.publish(S.base+'/cmd',p);
  if(S.ip) fetch(`http://${S.ip}/valve?node=${id}&action=${action}`,{mode:'no-cors'}).catch(()=>{});
}
function payZone(id){
  let amt=Number($('am'+id).value); if(!amt) return;
  let p=JSON.stringify({node:String(id),amount:amt});
  if(S.cli&&S.cli.connected) S.cli.publish(S.base+'/cmd',p);
  if(S.ip) fetch(`http://${S.ip}/pay?node=${id}&amount=${amt}`,{mode:'no-cors'}).catch(()=>{});
  $('mp'+id).textContent='✅ '+amt+'Ksh sent - Master opens valve '+id;
}
function timerIrrigate(id){
  let mins=Number($('timer'+id).value); if(!mins) return;
  cmd(id,'open'); $('mp'+id).textContent=`⏱ Irrigating ${mins} mins - Valve OPEN`;
  setTimeout(()=>{cmd(id,'close'); $('mp'+id).textContent=`✅ Timer done - Zone ${id} CLOSED`;}, mins*60*1000);
}

function connectAll(){
  S.base=$('cfgTopic').value.trim()||'aquasense/moses_kaaga_9x7p2'; S.ip=$('cfgIp').value.trim().replace(/\/$/,'');
  localStorage.setItem('AQUA_BASE',S.base); localStorage.setItem('AQUA_IP',S.ip);
  if(S.timer) clearInterval(S.timer);
  if(S.ip){
    let poll=()=>{fetch(`${S.ip}/data`,{cache:'no-store'}).then(r=>r.json()).then(d=>{mergeMaster(d); render();}).catch(()=>{});};
    poll(); S.timer=setInterval(poll,2000);
  }
  try{
    if(S.cli) S.cli.end();
    S.cli=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'irri_'+Math.random().toString(16).slice(2)});
    S.cli.on('connect',()=>{S.cli.subscribe(S.base+'/live');});
    S.cli.on('message',(t,m)=>{try{let d=JSON.parse(m.toString()); mergeMaster(d); render();}catch(e){}});
  }catch(e){}
}

function doSingleLogin(){
  let u=$('uid').value.trim().toLowerCase();
  let p=$('pwd').value.trim();
  S.base=$('cfgTopic').value.trim(); S.ip=$('cfgIp').value.trim();
  $('msg').textContent='';
  if(u==='admin' && p==='1234'){
    S.role='admin'; $('home').style.display='none'; $('dash').style.display='block'; render(); connectAll(); setInterval(()=>{if(S.role) render();},3000); return;
  }
  let f=REG.find(x=>x.id===u && x.pin===p && x.registered);
  if(f){ S.role='customer'; S.cur=u; $('home').style.display='none'; $('dash').style.display='block'; render(); connectAll(); setInterval(()=>{if(S.role) render();},3000); return; }
  $('msg').textContent='❌ Wrong. Admin: admin/1234 | Farmer: ID/PIN e.g. 1/1234';
}
function showReg(){let id=prompt("Zone ID (must match LoRa ID e.g. 1):"); if(!id) return; let name=prompt("Zone Name:","Zone "+id); let pin=prompt("PIN:","1234"); if(name&&pin){REG.push({id:String(id),name,pin,registered:true}); saveReg(); alert("Registered Zone "+id);}}
function logout(){ $('dash').style.display='none'; $('home').style.display='flex'; S.role=null; if(S.timer) clearInterval(S.timer); if(S.cli) S.cli.end(); S.nodes=[]; }
(function(){ $('cfgTopic').value=localStorage.getItem('AQUA_BASE')||'aquasense/moses_kaaga_9x7p2'; $('cfgIp').value=localStorage.getItem('AQUA_IP')||''; })();
</script>
</body>
</html>
